    <!-- Value State Description
    0     UNSENT    Client has been created. open() has not been called yet.
    1     OPENED    open() has been called. Headers can now be set, and the request can be sent.
    2     HEADERS_RECEIVED    send() has been called. The server has received the request and returned headers.
    3     LOADING    The response body is being downloaded; responseText may hold partial data.4DONEThe operation is complete. The data is fully received or the request failed. -->

    <button class="follow">Get</button>

    <div class="container"></div>

</body>

    function displayInfo(){
        const requestUrl = 'https://api.github.com/users/hiteshchoudhary'
        const xhr = new XMLHttpRequest();
        xhr.open('GET',requestUrl)

        xhr.onreadystatechange = function(){
            if(xhr.readyState === 4){
                const data = JSON.parse(this.responseText);
                const card = document.createElement('div');

                card.style.width = "220px";
                card.style.padding = "15px";
                card.style.marginTop = "20px";
                card.style.backgroundColor = "white";
                card.style.color = "black";
                card.style.borderRadius = "10px";

                card.innerHTML = `
                    <img 
                        src="${data.avatar_url}" 
                        width="180px" 
                        height="180px"
                        style="border-radius: 10px;"
                    >

                    <h2>${data.login}</h2>
                    <h3>Followers: ${data.followers}</h3>
                `;

                const container = document.querySelector('.container');
                // Removes old card
                container.innerHTML = '';
                // Adds new card
                container.appendChild(card);
            }
        } 
        xhr.send()
    }
    
    document.querySelector('.follow').addEventListener('click',displayInfo)
</script>
